name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt

      - name: Select Rust toolchain
        run: rustup override set "${{ matrix.rust }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Execute committed benchmark scenarios
        if: matrix.rust == 'stable'
        run: cargo test --test benchmark_scenarios -- --nocapture

      - name: Smoke-test query benchmark harness
        if: matrix.rust == 'stable'
        run: cargo run --quiet --example query_benchmark -- 200

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Build release binary
        if: matrix.rust == 'stable'
        run: cargo build --workspace --all-features --release

  platform:
    name: ${{ matrix.os }} portability
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Select stable Rust
        run: rustup override set stable

      - name: Check all portable targets
        run: cargo check --workspace --all-targets --all-features

      - name: Test library and binaries
        run: cargo test --workspace --lib --bins --all-features

      - name: Execute benchmark corpus
        run: cargo test --test benchmark_scenarios -- --nocapture

      - name: Test client setup and doctor round trip
        run: cargo test --test client_setup_roundtrip

      - name: Test complete integration suite on macOS
        if: runner.os == 'macOS'
        run: cargo test --test e2e

      - name: Test Windows validation timeout cleanup
        if: runner.os == 'Windows'
        run: cargo test --test e2e validation_timeout_kills_direct_child_on_windows -- --exact --nocapture

  npm:
    name: npm launcher ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18 is the launcher's `engines` floor.
        node: ["18", current]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Test the launcher
        run: npm test --prefix npm/foremerge

      # The fixtures pack archives with tar and zip, as the release does.
      - name: Test the package builder
        if: runner.os != 'Windows'
        run: node --test npm/scripts/build.test.mjs

  npm-smoke:
    name: npm install smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows installs the launcher as a .cmd shim, which doctor has to
        # recognise separately.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select stable Rust
        run: rustup override set stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: current

      - name: Build binaries
        run: cargo build --locked --bins

      - name: Install the packed tarballs and run them
        run: node npm/scripts/smoke.mjs --binaries target/debug
